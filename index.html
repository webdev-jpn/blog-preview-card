<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Fabicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <div class="card__image">
          <img
            src="./images/card-image.png"
            alt="Illustration for the article HTML & CSS foundations"
          />
        </div>
        <div class="card__content">
          <div class="card__content-tag">
            <span>Learning</span>
          </div>
          <div class="card__content-date">
            <time datetime="2023-12-21">Published 21 Dec 2023</time>
          </div>
          <div class="card__content-title">
            <a href="#">
              <h1>HTML & CSS foundations</h1>
            </a>
          </div>
          <div class="card__content-text">
            <p>
              These languages are the backbone of every website, defining
              structure, content, and presentation.
            </p>
          </div>
        </div>
        <address class="card__author">
          <div class="card__author-image">
            <img src="./images/image-avatar.webp" alt="" />
          </div>
          <div class="card__author-name">
            <span>Greg Hooper</span>
          </div>
        </address>
      </div>
    </main>
  </body>
</html>
